[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "speaksafe-hr"
version = "1.0.0"
description = "Private local employee feedback application"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "jinja2>=3.1,<4",
  "sqlalchemy>=2.0,<3", "pydantic-settings>=2.4,<3", "python-multipart>=0.0.9,<1",
  "httpx>=0.27,<1", "openai>=1.40,<2", "playwright>=1.46,<2",
  "google-api-python-client>=2.140,<3", "google-auth-oauthlib>=1.2,<2",
  "google-auth-httplib2>=0.2,<1"
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.23,<1", "ruff>=0.6,<1", "mypy>=1.11,<2"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["data", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008", "UP042"]

[tool.mypy]
python_version = "3.11"
files = ["app"]
ignore_missing_imports = true
check_untyped_defs = true
disallow_untyped_defs = false
warn_unused_ignores = true
